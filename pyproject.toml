[project]
name = "quantpc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.14.0",
    "datasets==5.0.1",
    "flash-attn==2.7.4.post1",
    "fuzzywuzzy==0.18.0",
    "huggingface-hub==0.36.2",
    "jieba==0.42.1",
    "rouge==1.0.1",
    "seaborn==0.13.2",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "transformers==4.53.2",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
