[project]
name = "picokv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.14.0",
    "triton==3.2.0",
    "datasets==5.0.1",
    "flash-attn==2.7.4.post1",
    "fuzzywuzzy==0.18.0",
    "huggingface-hub==0.36.2",
    "jieba==0.42.1",
    "rouge==1.0.1",
    "seaborn==0.13.2",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "transformers==4.53.2",
    "lm-eval==0.4.12",
    "loguru>=0.7.3",
    "wonderwords>=3.0.1",
    "nltk>=3.10.3",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
